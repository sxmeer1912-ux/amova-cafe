<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Amova Cafe</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    background:#fff8f3;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.auth-container{
    width:100%;
    max-width:430px;
    background:white;
    padding:35px;
    border-radius:18px;
    box-shadow:0 5px 25px rgba(0,0,0,0.12);
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:bold;
    color:#8b451f;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:30px;
}

.form-title{
    font-size:24px;
    color:#7d3f21;
    margin-bottom:20px;
}

.form-group{
    margin-bottom:16px;
}

label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
    color:#444;
}

input{
    width:100%;
    padding:13px 14px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#9b4d2b;
}

.main-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#9b4d2b;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:5px;
}

.main-btn:hover{
    background:#7d3f21;
}

.switch{
    text-align:center;
    margin-top:20px;
    color:#666;
}

.switch button{
    border:none;
    background:none;
    color:#9b4d2b;
    font-weight:bold;
    cursor:pointer;
    font-size:15px;
}

.message{
    margin-top:15px;
    text-align:center;
    font-size:14px;
    display:none;
    padding:10px;
    border-radius:7px;
}

.success{
    background:#e8f7e8;
    color:#287328;
}

.error{
    background:#ffe9e9;
    color:#b00000;
}

.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#9b4d2b;
    text-decoration:none;
    font-weight:bold;
}

@media(max-width:480px){

    .auth-container{
        padding:25px 20px;
    }

    .logo{
        font-size:26px;
    }
}
</style>
</head>

<body>

<div class="auth-container">

    <div class="logo">
        Amova Cafe
    </div>

    <div class="subtitle">
        Welcome to Amova Cafe ☕
    </div>


    <!-- LOGIN FORM -->

    <div id="loginSection">

        <div class="form-title">
            Login
        </div>

        <div class="form-group">
            <label>Email</label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
            >
        </div>


        <div class="form-group">
            <label>Password</label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
            >
        </div>


        <button
            class="main-btn"
            id="loginBtn"
        >
            Login
        </button>


        <div class="switch">
            Don't have an account?

            <button id="showSignup">
                Sign Up
            </button>
        </div>

    </div>



    <!-- SIGN UP FORM -->

    <div id="signupSection" style="display:none;">

        <div class="form-title">
            Create Account
        </div>


        <div class="form-group">
            <label>Name</label>

            <input
                type="text"
                id="signupName"
                placeholder="Enter your name"
            >
        </div>


        <div class="form-group">
            <label>Email</label>

            <input
                type="email"
                id="signupEmail"
                placeholder="Enter your email"
            >
        </div>


        <div class="form-group">
            <label>Password</label>

            <input
                type="password"
                id="signupPassword"
                placeholder="Create password"
            >
        </div>


        <div class="form-group">
            <label>Confirm Password</label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm password"
            >
        </div>


        <button
            class="main-btn"
            id="signupBtn"
        >
            Create Account
        </button>


        <div class="switch">
            Already have an account?

            <button id="showLogin">
                Login
            </button>
        </div>

    </div>


    <div
        id="message"
        class="message"
    ></div>


    <a
        href="index.html"
        class="back"
    >
        ← Back to Menu
    </a>

</div>



<script type="module">

import { auth } from "./js/firebase.js";

import {
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    updateProfile
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";



const loginSection =
    document.getElementById("loginSection");

const signupSection =
    document.getElementById("signupSection");

const showSignup =
    document.getElementById("showSignup");

const showLogin =
    document.getElementById("showLogin");

const message =
    document.getElementById("message");



function showMessage(text,type){

    message.textContent = text;

    message.className =
        "message " + type;

    message.style.display = "block";

}



function hideMessage(){

    message.style.display = "none";

}



showSignup.addEventListener("click",()=>{

    hideMessage();

    loginSection.style.display = "none";

    signupSection.style.display = "block";

});



showLogin.addEventListener("click",()=>{

    hideMessage();

    signupSection.style.display = "none";

    loginSection.style.display = "block";

});



/* LOGIN */

document
.getElementById("loginBtn")
.addEventListener("click",async()=>{

    const email =
        document
        .getElementById("loginEmail")
        .value
        .trim();

    const password =
        document
        .getElementById("loginPassword")
        .value;


    if(!email || !password){

        showMessage(
            "Please enter email and password.",
            "error"
        );

        return;
    }


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


        showMessage(
            "Login successful! Redirecting...",
            "success"
        );


        setTimeout(()=>{

            window.location.href =
                "index.html";

        },1000);


    }catch(error){

        console.error(error);

        let msg =
            "Login failed. Please try again.";

        if(error.code === "auth/invalid-credential"){
            msg = "Invalid email or password.";
        }

        if(error.code === "auth/user-not-found"){
            msg = "Account not found.";
        }

        if(error.code === "auth/wrong-password"){
            msg = "Wrong password.";
        }

        showMessage(msg,"error");

    }

});



/* SIGN UP */

document
.getElementById("signupBtn")
.addEventListener("click",async()=>{

    const name =
        document
        .getElementById("signupName")
        .value
        .trim();

    const email =
        document
        .getElementById("signupEmail")
        .value
        .trim();

    const password =
        document
        .getElementById("signupPassword")
        .value;

    const confirmPassword =
        document
        .getElementById("confirmPassword")
        .value;


    if(!name || !email || !password || !confirmPassword){

        showMessage(
            "Please fill all fields.",
            "error"
        );

        return;
    }


    if(password.length < 6){

        showMessage(
            "Password must be at least 6 characters.",
            "error"
        );

        return;
    }


    if(password !== confirmPassword){

        showMessage(
            "Passwords do not match.",
            "error"
        );

        return;
    }


    try{

        const userCredential =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        await updateProfile(
            userCredential.user,
            {
                displayName:name
            }
        );


        showMessage(
            "Account created successfully! Redirecting...",
            "success"
        );


        setTimeout(()=>{

            window.location.href =
                "index.html";

        },1000);


    }catch(error){

        console.error(error);

        let msg =
            "Unable to create account.";

        if(error.code === "auth/email-already-in-use"){
            msg = "This email is already registered.";
        }

        if(error.code === "auth/invalid-email"){
            msg = "Please enter a valid email.";
        }

        if(error.code === "auth/weak-password"){
            msg = "Password is too weak.";
        }

        showMessage(msg,"error");

    }

});

</script>

</body>
</html>
