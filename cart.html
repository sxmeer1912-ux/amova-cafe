<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Amova Cafe - Cart</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f3ef;
            color: #333;
        }

        header {
            background: #6b3e26;
            color: white;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            font-size: 22px;
        }

        .back-btn {
            background: #4d2b1b;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 7px;
            cursor: pointer;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 25px 15px;
        }

        h1 {
            text-align: center;
            color: #6b3e26;
            margin-bottom: 25px;
        }

        .cart-item {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);

            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* PRODUCT IMAGE */

        .cart-image {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 10px;
            flex-shrink: 0;
            background: #eee;
        }

        .item-info {
            flex: 1;
        }

        .item-info h3 {
            color: #6b3e26;
            margin-bottom: 8px;
        }

        .item-price {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .quantity {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity button {
            width: 35px;
            height: 35px;
            border: none;
            border-radius: 6px;
            background: #6b3e26;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        .quantity span {
            font-size: 17px;
            font-weight: bold;
            min-width: 20px;
            text-align: center;
        }

        .item-right {
            text-align: right;
            min-width: 110px;
        }

        .item-total {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 10px;
        }

        .remove-btn {
            background: #d32f2f;
            color: white;
            border: none;
            padding: 9px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .summary {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-top: 25px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        .total {
            display: flex;
            justify-content: space-between;
            font-size: 22px;
            font-weight: bold;
            color: #6b3e26;
            margin-bottom: 18px;
        }

        .checkout-btn {
            width: 100%;
            background: #168a45;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
        }

        .empty {
            background: white;
            padding: 40px 20px;
            text-align: center;
            border-radius: 12px;
            color: #777;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        .empty button {
            margin-top: 15px;
            background: #6b3e26;
            color: white;
            border: none;
            padding: 11px 18px;
            border-radius: 7px;
            cursor: pointer;
        }

        @media(max-width:600px) {

            header h2 {
                font-size: 18px;
            }

            .cart-item {
                align-items: flex-start;
            }

            .cart-image {
                width: 75px;
                height: 75px;
            }

            .item-info h3 {
                font-size: 16px;
            }

            .item-price {
                font-size: 14px;
            }

            .item-right {
                min-width: auto;
            }

            .item-total {
                font-size: 16px;
            }

            .remove-btn {
                padding: 8px 10px;
                font-size: 13px;
            }

            .quantity {
                margin-top: 5px;
            }

        }

    </style>

</head>


<body>


<header>

    <h2>☕ Amova Cafe</h2>

    <button
        class="back-btn"
        onclick="window.location.href='index.html'">

        ← Menu

    </button>

</header>


<div class="container">

    <h1>🛒 Your Cart</h1>

    <div id="cartContainer"></div>

</div>


<script>


const cartContainer =
    document.getElementById("cartContainer");



/* =========================================
   GET CART
========================================= */

function getCart() {

    return JSON.parse(
        localStorage.getItem("amovaCart")
    ) || [];

}



/* =========================================
   SAVE CART
========================================= */

function saveCart(cart) {

    localStorage.setItem(
        "amovaCart",
        JSON.stringify(cart)
    );

}



/* =========================================
   IMAGE FUNCTION
========================================= */

function getImage(item) {

    /* 
       If the cart item already contains
       an image path, use it.
    */

    if (item.image) {
        return item.image;
    }


    /*
       Backup mapping for older cart items
       that don't have an image saved.
    */

    const name =
        String(item.name || "").toLowerCase();


    if (name.includes("mango")) {
        return "images/juice.jpg";
    }

    if (name.includes("orange")) {
        return "images/orange-juice.jpg";
    }

    if (name.includes("pineapple")) {
        return "images/pineapple.jpg";
    }

    if (name.includes("coffee")) {
        return "images/coffee.jpg";
    }

    if (name.includes("sandwich")) {
        return "images/sandwich.jpg";
    }

    if (name.includes("burger")) {
        return "images/burger.jpg";
    }

    if (name.includes("pizza")) {
        return "images/pizza.jpg";
    }


    return "images/juice.jpg";

}



/* =========================================
   INCREASE
========================================= */

function increase(index) {

    const cart = getCart();

    cart[index].quantity += 1;

    saveCart(cart);

    displayCart();

}



/* =========================================
   DECREASE
========================================= */

function decrease(index) {

    const cart = getCart();

    cart[index].quantity -= 1;


    if (cart[index].quantity <= 0) {

        cart.splice(index, 1);

    }


    saveCart(cart);

    displayCart();

}



/* =========================================
   REMOVE
========================================= */

function removeItem(index) {

    const cart = getCart();

    cart.splice(index, 1);

    saveCart(cart);

    displayCart();

}



/* =========================================
   CHECKOUT
========================================= */

function goCheckout() {

    const cart = getCart();


    if (cart.length === 0) {

        alert("Your cart is empty.");

        return;

    }


    window.location.href =
        "checkout.html";

}



/* =========================================
   DISPLAY CART
========================================= */

function displayCart() {

    const cart = getCart();


    if (cart.length === 0) {

        cartContainer.innerHTML = `

            <div class="empty">

                <h2>🛒 Your cart is empty</h2>

                <p style="margin-top:10px;">
                    Add some delicious items from our menu.
                </p>

                <button
                    onclick="window.location.href='index.html'">

                    🍹 Go to Menu

                </button>

            </div>

        `;

        return;

    }


    let total = 0;

    let html = "";


    cart.forEach(
        function(item, index) {


            const price =
                Number(item.price) || 0;


            const quantity =
                Number(item.quantity) || 1;


            const itemTotal =
                price * quantity;


            total += itemTotal;


            const image =
                getImage(item);


            html += `

                <div class="cart-item">


                    <!-- PRODUCT IMAGE -->

                    <img
                        class="cart-image"
                        src="${image}"
                        alt="${item.name}"
                        onerror="this.src='images/juice.jpg'"
                    >


                    <!-- ITEM DETAILS -->

                    <div class="item-info">

                        <h3>
                            ${item.name}
                        </h3>


                        <div class="item-price">

                            ₹${price} × ${quantity}

                        </div>


                        <div class="quantity">

                            <button
                                onclick="decrease(${index})">

                                −

                            </button>


                            <span>
                                ${quantity}
                            </span>


                            <button
                                onclick="increase(${index})">

                                +

                            </button>

                        </div>

                    </div>


                    <!-- TOTAL / REMOVE -->

                    <div class="item-right">

                        <div class="item-total">

                            ₹${itemTotal}

                        </div>


                        <button
                            class="remove-btn"
                            onclick="removeItem(${index})">

                            🗑️ Remove

                        </button>

                    </div>


                </div>

            `;

        }
    );


    html += `

        <div class="summary">

            <div class="total">

                <span>Total</span>

                <span>
                    ₹${total}
                </span>

            </div>


            <button
                class="checkout-btn"
                onclick="goCheckout()">

                Proceed to Checkout →

            </button>

        </div>

    `;


    cartContainer.innerHTML =
        html;

}



/* =========================================
   START
========================================= */

displayCart();

</script>


</body>

</html>
