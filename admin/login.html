<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Amova Cafe - Admin Login</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #faf8ef;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.login-box {
    width: 90%;
    max-width: 420px;
    background: white;
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 10px 35px rgba(0,0,0,0.12);
}

.logo {
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    color: #173d25;
    margin-bottom: 10px;
}

.logo span {
    color: #d7bd67;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 30px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
    margin-bottom: 20px;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 30px;
    background: #08783d;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #173d25;
}

#error {
    color: #d00000;
    text-align: center;
    margin-top: 15px;
}

</style>

</head>

<body>

<div class="login-box">

    <div class="logo">
        Amova <span>Cafe</span>
    </div>

    <div class="subtitle">
        🔐 Admin Login
    </div>

    <form id="loginForm">

        <label>
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter admin email"
            required
        >

        <label>
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
        >

        <button type="submit">
            🔐 Login
        </button>

    </form>

    <div id="error"></div>

</div>


<script type="module">

import {
    auth
} from "../js/firebase.js";

import {
    signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


const loginForm =
    document.getElementById("loginForm");

const errorMessage =
    document.getElementById("error");


loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;


    try {

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        window.location.href =
            "dashboard.html";

    }

    catch (error) {

        console.error(error);

        errorMessage.textContent =
            "❌ Invalid email or password.";

    }

});

</script>

</body>

</html>
